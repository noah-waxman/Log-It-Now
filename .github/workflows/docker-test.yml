name: Log It Now
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Initialize .env from example
        run: |
          cp .env.example .env

      - name: Start Docker Compose
        run: docker compose up -d --wait --wait-timeout 60

      - name: Confirm db is reachable
        run: docker compose exec -T db pg_isready -U "${POSTGRES_USER:-postgres}"

      - name: Show status (debug on failure)
        if: always()
        run: docker compose ps

      - name: Close Docker Containers
        if: always()
        run: docker compose down -v
